name: Build APK

on:
  push:
    branches: [ "sejioo", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare project
        run: |
          echo "=== TREE BEFORE ==="
          ls -R
          echo "=== END TREE ==="

          M=$(find . -name AndroidManifest.xml -not -path './.git/*' | head -1)
          echo "MANIFEST: $M"
          if [ -n "$M" ]; then
            S=$(dirname "$(dirname "$M")")
            echo "SOURCE DIR: $S"
            if [ "$S" != "./app/src" ]; then
              rm -rf app/src
              mkdir -p app
              cp -r "$S" app/src
            fi
          fi

          mkdir -p app

          cat > settings.gradle <<'EOF'
          rootProject.name = "Sejio"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          EOF

          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace 'app.zizi.assistant'
              compileSdk 33

              defaultConfig {
                  applicationId "app.zizi.assistant"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "0.1"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          echo "=== TREE AFTER ==="
          ls -R app

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
