name: Build APK

on:
  push:
    branches: [ "sejioo", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare project
        run: |
          set -e
          echo "=== FILES IN REPO ==="
          ls -R | head -50

          rm -rf /tmp/b
          mkdir -p /tmp/b/java /tmp/b/main /tmp/b/res/layout /tmp/b/res/values /tmp/b/res/drawable

          find . -path ./.git -prune -o -name '*.java' -print -exec cp {} /tmp/b/java/ \;
          find . -path ./.git -prune -o -name 'AndroidManifest.xml' -print -exec cp {} /tmp/b/main/ \;
          find . -path ./.git -prune -o -name 'activity_main.xml' -print -exec cp {} /tmp/b/res/layout/ \;
          find . -path ./.git -prune -o -name 'strings.xml' -print -exec cp {} /tmp/b/res/values/ \;
          find . -path ./.git -prune -o -name 'styles.xml' -print -exec cp {} /tmp/b/res/values/ \;
          find . -path ./.git -prune -o -name 'ic_launcher*' -print -exec cp {} /tmp/b/res/drawable/ \;

          rm -rf app
          mkdir -p app/src/main/java/app/zizi/assistant
          mkdir -p app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable

          cp /tmp/b/java/*.java app/src/main/java/app/zizi/assistant/
          cp /tmp/b/main/AndroidManifest.xml app/src/main/
          cp /tmp/b/res/layout/activity_main.xml app/src/main/res/layout/
          cp /tmp/b/res/values/strings.xml app/src/main/res/values/
          cp /tmp/b/res/values/styles.xml app/src/main/res/values/
          if ls /tmp/b/res/drawable/* >/dev/null 2>&1; then
            cp /tmp/b/res/drawable/* app/src/main/res/drawable/
          else
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24">' '  <path android:fillColor="#2BB673" android:pathData="M12,14a3,3 0 0,0 3,-3V5a3,3 0 0,0 -6,0v6a3,3 0 0,0 3,3z"/>' '</vector>' > app/src/main/res/drawable/ic_launcher.xml
          fi

          cat > settings.gradle <<'EOF'
          rootProject.name = "Sejio"
          include ':app'
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace 'app.zizi.assistant'
              compileSdk 33
              defaultConfig {
                  applicationId "app.zizi.assistant"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "0.1"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          echo "=== PROJECT TREE ==="
          find app -type f | sort

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
